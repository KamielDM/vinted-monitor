# Vinted PS5 Games Monitor - instellingen. Pas aan en herstart de monitor.
# Geheimen (Telegram token/chat id) staan NIET hier maar in .env (eigen bot, niet die van de console-monitor).

[search]
# Categorie Games (3026) + platform PlayStation 5 (1281), nieuwste eerst: één poll ziet alle nieuwe PS5-games,
# ook bulkadvertenties. order=newest_first wordt automatisch toegevoegd.
urls = [
  "https://www.vinted.be/catalog?catalog[]=3026&video_game_platform_ids[]=1281",
  # stuur + pedalen staan bij Controllers (3570); de URL's worden om beurten gepolld
  "https://www.vinted.be/catalog?catalog[]=3570&video_game_platform_ids[]=1281",
]
# Titel noemt de reeks maar niet welk deel ("Call of Duty PS5") -> beschrijving lezen om te zien welke game het is.
hints = 'volant|volante|stuur|lenkrad|wheel|call\W*of\W*duty|\bcod\b|\bark\b|black\W*ops|modern\W*warfare'
# Seconden tussen polls. Gemeten 20/10: ±4 nieuwe PS5-games per minuut, dus 10 s is ruim genoeg.
interval_seconds = 15   # meerdere monitors op één IP: rustig aan
night_hours = [1, 7]
night_interval_seconds = 60

# Gezochte games. pattern = regex op de titel (kleine letters, zonder accenten); max = maximumprijs (zonder verzending).
# Prijzen gemeten 20/10 op vinted.be (vraagprijzen PS5): max ligt rond de goedkoopste kwart van de markt.
[games.bo7]
name = "Call of Duty: Black Ops 7"
pattern = '\bblack\W*ops\W*(7|vii)\b|\bbo\W*7\b'
max = 20        # markt: goedkoop €20, midden €22
retail = 32.99   # nieuw bij bol.com (BE), 20/10: rechts op de prijsbalk

[games.bo6]
name = "Call of Duty: Black Ops 6"
pattern = '\bblack\W*ops\W*(6|vi)\b|\bbo\W*6\b'
max = 12        # markt: goedkoop €10, midden €15
retail = 38.31   # nieuw bij bol.com (BE), 20/10: rechts op de prijsbalk

[games.mw3]
name = "Call of Duty: Modern Warfare III"
pattern = '\bmodern\W*warfare\W*(3|iii)\b|\bmw\W*(3|iii)\b'
max = 15        # markt: goedkoop €15, midden €17
retail = 54.00   # nieuw bij bol.com (BE), 20/10: rechts op de prijsbalk

[games.ark]
name = "ARK: Survival Ascended"
pattern = '\bark\b.{0,40}\bascended\b|\bascended\b.{0,40}\bark\b'
max = 17        # tweedehands mét kosten ±€2 onder nieuw: €17 + €1,55 bescherming + ±€4,50 verzending = ±€23 (nieuw €25,99)
retail = 25.99   # nieuw bij bol.com (BE), 20/10: rechts op de prijsbalk

[games.gt7]
name = "Gran Turismo 7"
pattern = '\bgran\W*turismo\W*7\b|\bgt\W*7\b'
max = 20
retail = 39.95   # nieuw bij bol.com (BE), 20/10

[games.stuur]
name = "Stuur + pedalen"
pattern = '\b(volant|volante|stuur|racestuur|lenkrad|steering\W*wheel|racing\W*wheel|g29|g923|t248|t300\w*|t150|t128|t80|tx|t\W*gt\W*ii|fanatec|csl\W*dd|gt\W*dd)\b'
max = 120
retail = 199     # Logitech G29/G923 nieuw, ongeveer

[filters]
min_price = 3
ps4_ok = ["stuur"]       # PS4-sturen (G29, T150, ...) werken ook op de PS5            # nog goedkoper = bijna altijd een hoesje, code of lokprijs
# Bulk: advertentie met minstens bulk_min PS5-games ("lot de 5 jeux", "10 giochi"). Ongeacht welke games: jij kijkt.
bulk_min = 3
bulk_max_per_game = 6    # max. prijs per game in een lot
bulk_max_total = 60      # en nooit meer dan dit in totaal
# Zet een verkoper dezelfde advertentie (zelfde titel, foto of game) steeds opnieuw online, dan vanaf de
# 3e keer in 7 dagen niet meer melden (verwijderen + herplaatsen is een typisch scampatroon).
max_reposts = 2
# Verkopers (gebruikers-ID) die altijd overgeslagen worden. Daarnaast blokkeert de monitor zelf elke verkoper die de
# laatste 30 dagen als scammer werd uitgesloten (scamwoord, scam-review, herplaatsen, te lage prijs).
blocked_sellers = [
  # gebruikers-ID's die je nooit wilt zien
]
min_reviews = 1          # verkopers zonder reviews overslaan (0 = uit)
min_trust_score = 40     # onder deze score geen melding
silent_below = 40
suspicious_price = { default = 4 }   # onder dit bedrag = te mooi om waar te zijn -> overslaan
# Zelfde foto als een andere verkoper: bij games gebruiken veel eerlijke verkopers dezelfde hoesfoto van internet.
duplicate_photo_penalty = 10

[vision]
# Fotocheck met CLIP staat uit: de omschrijvingen zijn gemaakt voor consoles, niet voor gamehoesjes.
enabled = false
stock_threshold = 0.5
[vision.labels]
stock = "an official product photo of a game console isolated on a white background"
other = "a photo of a video game case on a table"

[rules]
# Woorden worden hoofdletter-, accent- en spatie-ongevoelig gezocht: "paypal" vangt ook
# "PayPal", "pay pal", "P.a.y.p.a.l", "p4ypal". Losse woorden van 10+ letters mogen 1 typfout hebben
# ("transferencia" vangt "trasferencia"). Scamwoorden gelden ook voor de verkopersbio. Begin met "re:" voor een eigen regex.

# In titel + beschrijving -> uitsluiten (externe betaling / contact buiten Vinted)
scam = [
  "paypal", "iban", "bank transfer", "banktransfer", "wire transfer", "overschrijving", "bankoverschrijving",
  "virement", "bonifico", "postepay", "ricarica", "uberweisung", "bankuberweisung", "sofortuberweisung",
  "vorkasse", "transferencia", "bizum",
  "western union", "moneygram", "revolut", "wise transfer", "payconiq", "lydia", "crypto", "bitcoin",
  "friends and family", "amici e parenti", "beni e servizi",
  "hors vinted", "en dehors de vinted", "sans passer par vinted", "buiten vinted", "zonder vinted",
  "outside vinted", "fuori vinted", "fuera de vinted", "ausserhalb von vinted",
  "whatsapp", "whats app", "wa.me", "telegram", "whatzap", "whatzzap", "watsap", "watsapp", "wsp",
  "instagram", "insta", "istangram", "snapchat", "snap", 're:👻',   # 👻 = Snapchat-naam ("👻 voorbeeld.123")
  "no vinted", "pas via vinted", "pas par vinted", "nicht uber vinted", "nicht uber das vinted", "solo per vetrina",
  "spedisco privatamente", "spedizione privata", "echtzeit", "vorher zahlung", "zahlung vorab", "send the money",
  "send money", "refunder",
  # "eerst contact opnemen vóór je koopt" = gesprek buiten Vinted willen trekken
  "prima di acquistare", "prima dell'acquisto", "contattatemi prima", "bevor sie es kaufen", "vor dem kauf",
  "zuerst anschreiben", "vorher anschreiben", "avant d'acheter", "avant tout achat", "contact me before",
  "before buying", "antes de comprar", "voordat je koopt",
  # je koopt alleen een foto van een PS5
  "impresa en papel", "imagen impresa", "photo imprimee", "foto stampata", "solo la foto", "nur das bild",
  "picture only", "only the picture", "alleen de foto",
  # contactgegevens in de bio
  "leggi bio", "leggi la bio", "guarda in bio", "guarda la bio", "voir bio", "voir ma bio", "check bio", "check my bio",
  "mira mi bio", "siehe bio", "zie bio",
  # 20/10: varianten uit de opgeslagen advertenties
  "systemverkauf", "kein vinted kauf", "vor der zahlung", "bevor sie auf", "avant achat", "contacter avant",
  "antes de hacer la compra", "non spediamo tramite vinted", "non spedisco tramite vinted", "no hago envios por vinted",
  "kein versand uber vinted", "pas d'envoi via vinted", "pas d'envoi par vinted",
  "wallet vinted", "vinted wallet", "portefeuille vinted", "porte monnaie vinted", "portafoglio vinted", "monedero vinted",
  "paiement en prive", "paiement en mp", "pagamento in privato", "pago por privado", "zahlung privat", "passer prive",
  "passer en prive", "payment directly", "pay directly", "non leggo i messaggi", "non leggiamo i messaggi", "leggo solo su",
  "je ne lis pas les messages", "me estafaron", "malas experiencias", "trop eu de litige",
  're:https?://\S+',                     # links in beschrijving of bio
  're:(?i)\b(?:at|a|à|auf|op|por)\s*(?:1|un|one|uno|einen)\s*(?:€|euro)\b',  # "I'll put the play at one euro"
  # weigert betaling via Vinted: ontkenning + betalen + systeem/Vinted/app in dezelfde zin, behalve "alleen via Vinted"
  # ("Ich akzeptiere keine Zahlungen über das System", "PAS DE PAIEMENT VIA VINTED", "no acepto el pago por vinted")
  're:(?i)(?:\b(keine?[nr]?|nicht|ohne|geen|niet|nooit|no|non|pas|sans|sin|not|never|jamais|nunca|mai|don\x27?t|do not)\b(?:(?!uniquement|seulement|solo|solamente|only|nur|alleen|enkel|unicamente|exclusivement|esclusivamente)[^.!?\n]){0,40}\b(zahlung|bezahl|betaling|betaal|betalen|paiement|payer|pagament|pagar|pago|payment|pay)|\b(keine?[nr]?|nicht|ohne|geen|niet|nooit|no|non|pas|sans|sin|not|never|jamais|nunca|mai|don\x27?t|do not)\b[^.!?\n,]{0,15}\b(kauf|verkauf|achat|vente|vendit[ae]|venta|compra|acquist|buy|purchase|sale|koop|verkoop))\w*(?:(?!uniquement|seulement|solo|solamente|only|nur|alleen|enkel|unicamente|exclusivement|esclusivamente)[^.!?\n]){0,40}\b(system\w*|syst[eè]me|systeem|sistema|vinted|app|applicazione|application|aplicaci[oó]n|plattform|plateforme|piattaforma|plataforma|platform|site|sito|sitio|seite|website)\b(?!\W*(uniquement|seulement|solo|solamente|only|nur|alleen|enkel|unicamente|exclusivement|esclusivamente)\b)',
  're:[\w.+-]+@[\w-]+\.[a-z]{2,}',          # e-mailadres
  're:(?:\+|00)\d[\d .-]{7,}\d',            # internationaal telefoonnummer
  're:(?<![\d,.€])(?:\d[ .-]{0,2}){8,}\d(?![\d€])',  # telefoonnummer: 9+ cijfers, ook 351--23--45--678 (datums en 825 GB tellen niet)
]

