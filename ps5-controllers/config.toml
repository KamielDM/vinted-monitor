# Vinted PS5 Controller Monitor - instellingen. Pas aan en herstart de monitor.
# Geheimen (Telegram token/chat id) staan NIET hier maar in .env (eigen bot per monitor).

[search]
# Categorie Controllers (3570) + platform PlayStation 5 (1281), nieuwste eerst.
urls = [
  "https://www.vinted.be/catalog?catalog[]=3570&video_game_platform_ids[]=1281",
]
# Titel zegt niet duidelijk dat het een controller is -> beschrijving lezen.
hints = 'man+et+e|controller|mando|joystick|joypad|controle|comando|gamepad|dual\W*sense'
interval_seconds = 15   # meerdere monitors op één IP: rustig aan
night_hours = [1, 7]
night_interval_seconds = 60

# Wat gezocht wordt: een PS5-controller (DualSense). Staat er alleen PS4/PS3, dan valt hij weg; niets = jij beslist.
# Markt 20/10 op vinted.be (DualSense zonder drift): goedkoop €44, midden €55.
[games.tmr]
name = "TMR/Hall-sticks (los)"
pattern = '^(?!.*\b(man+et+es?|controllers?|mandos?|dual\W*sense|joypads?|comandos?|gamepads?|kontroller)\b).*(\btmr\b|hall\W*eff|k\W?silver|ginfull|gulikit)'
max = 25        # GuliKit TMR nieuw ±€20 per stick, Ginfull ±€8 voor 2 (20/10)
retail = 40     # winkelprijs nieuw (GuliKit TMR nieuw: 2 x ±€20): rechts op de prijsbalk

[games.dualsense]
name = "PS5-controller (DualSense)"
pattern = '\bdual\W*sense\b|\bscuf\b|\b(man+et+es?|controllers?|mandos?|joysticks?|joypads?|controle|comandos?|gamepads?|kontroller|controlador)\b'
max = 25        # 21/10: alleen echte deals
retail = 70     # winkelprijs nieuw (nieuw in de winkel, zonder extra kosten): rechts op de prijsbalk

[filters]
min_price = 5
drift_max = 20           # met drift (zelf te herstellen met Hall/TMR-sticks): max. deze prijs
bulk = false             # geen bulk bij controllers
bulk_min = 99
bulk_max_per_game = 0
bulk_max_total = 0
max_reposts = 2
blocked_sellers = [
  # gebruikers-ID's die je nooit wilt zien
]
min_reviews = 1
min_trust_score = 40
silent_below = 40
suspicious_price = { default = 8 }   # nog goedkoper = te mooi om waar te zijn
duplicate_photo_penalty = 10         # veel verkopers gebruiken dezelfde productfoto

[vision]
enabled = false
stock_threshold = 0.5
[vision.labels]
stock = "an official product photo of a game controller isolated on a white background"
other = "a photo of a game controller on a table"

[rules]
