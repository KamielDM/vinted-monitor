# Vinted PS5 Monitor - instellingen. Pas aan en herstart de monitor.
# Geheimen (Telegram token/chat id) staan NIET hier maar in .env

[search]
# Plak hier een of meer Vinted-zoek-URL's (kopieer ze uit je browser). De regio volgt uit het domein
# (vinted.be, vinted.nl, vinted.fr, ...). order=newest_first wordt automatisch toegevoegd.
# Standaard: categorie Consoles (3025) + platform PlayStation 5 (1281). Vangt ook titels zonder "PS5".
urls = [
  "https://www.vinted.be/catalog?catalog[]=3025&video_game_platform_ids[]=1281",
]
# Seconden tussen polls. Elke poll is ~0,5 MB. Lager = sneller, maar belast Vinted meer (niet onder 10 gaan).
interval_seconds = 15   # meerdere monitors op één IP: rustig aan
# Nachtstand: tussen deze uren (van, tot) trager zoeken. Er verschijnt dan weinig en je slaapt toch. [] = uit.
night_hours = [1, 7]
night_interval_seconds = 60

[filters]
min_price = 150          # filtert losse accessoires/games eruit
max_price = 500
# Optioneel per model een eigen maximum (overschrijft max_price):
max_price_per_model = { pro = 650 }
# Welke modellen/edities wil je? Mogelijk: "slim", "pro", "original" (de eerste, dikke "fat") en "disc", "digital".
models = ["slim", "pro"]
editions = ["disc"]
# Deze modellen mogen elke editie (een Pro wordt standaard zonder lezer verkocht; die koop je los bij).
any_edition = ["pro"]
# Advertentie zonder vermeld model (bv. enkel "Playstation 5"): true = melden met "❓ Model niet vermeld", jij kijkt
# op de foto's; false = overslaan. Alleen wat er echt staat (Digital, fat, 825 GB, Pro/Slim) wordt gefilterd.
# Een onbekende editie (disc/digital niet vermeld) komt ook door; de melding toont dan "PS5 Slim" zonder "Disc".
unknown_model = true
# Zet een verkoper dezelfde advertentie (zelfde titel of foto) steeds opnieuw online, dan vanaf de
# 3e keer in 7 dagen niet meer melden (verwijderen + herplaatsen is een typisch scampatroon).
max_reposts = 2
# Verkopers (gebruikers-ID) die altijd overgeslagen worden. Daarnaast blokkeert de monitor zelf elke verkoper die de
# laatste 30 dagen als scammer werd uitgesloten (scamwoord, scam-review, herplaatsen, te lage prijs).
blocked_sellers = [
  # gebruikers-ID's die je nooit wilt zien
]
# Verkopers met minder reviews overslaan (1 = geen advertenties van accounts zonder reviews; 0 = uit).
min_reviews = 1
# Onder deze score geen melding (0-100, zie README voor de berekening).
min_trust_score = 40
# Onder deze score komt de melding stil binnen (geen geluid/trilling), zodat alleen betrouwbare deals je storen.
silent_below = 40
# Prijs onder dit bedrag = te mooi om waar te zijn -> overslaan (gemeten 19/10: Pro's van €200-360 en Slims van €150
# die doorkwamen, waren scams; echte verkopen lagen op Pro €450-650, Slim €250+).
suspicious_price = { default = 200, pro = 400 }

[vision]
# Fotocheck met CLIP (lokaal, gratis, ±155 MB model in ../models). Draait pas ná de melding, alleen voor
# gemelde advertenties, en werkt de melding dan bij. Herkent officiële productfoto's (stockfoto's).
enabled = true
stock_threshold = 0.5   # gemeten 14/10: officiële Sony-foto's 0,67-0,73, echte advertentiefoto's max 0,30
# Engelse beschrijvingen; "stock" is wat telt, de rest zijn afleiders zodat tv-schermen en close-ups
# niet als stockfoto gezien worden. Voor een ander product: deze zinnen aanpassen.
[vision.labels]
stock = "an official product photo of a game console isolated on a white background"
console = "a photo of a PlayStation 5 game console in a room"
box = "a photo of a cardboard PlayStation 5 retail box"
controller = "a close-up photo of a game controller"
tv = "a photo of a television screen showing a video game"
closeup = "a close-up photo of a white plastic surface"
screenshot = "a screenshot of a website, chat or receipt with text"

[rules]
# Woorden worden hoofdletter-, accent- en spatie-ongevoelig gezocht: "paypal" vangt ook
