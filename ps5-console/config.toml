# ("transferencia" vangt "trasferencia"). Scamwoorden gelden ook voor de verkopersbio. Begin met "re:" voor een eigen regex.

# In titel + beschrijving -> uitsluiten (externe betaling / contact buiten Vinted)
scam = [
  "paypal", "iban", "bank transfer", "banktransfer", "wire transfer", "overschrijving", "bankoverschrijving",
  "virement", "bonifico", "postepay", "ricarica", "uberweisung", "bankuberweisung", "sofortuberweisung",
  "vorkasse", "transferencia", "bizum",
  "western union", "moneygram", "revolut", "wise transfer", "payconiq", "lydia", "crypto", "bitcoin",
  "friends and family", "amici e parenti", "beni e servizi",
  "hors vinted", "en dehors de vinted", "sans passer par vinted", "buiten vinted", "zonder vinted",
  "outside vinted", "fuori vinted", "fuera de vinted", "ausserhalb von vinted",
  "whatsapp", "whats app", "wa.me", "telegram", "whatzap", "whatzzap", "watsap", "watsapp", "wsp",
  "instagram", "insta", "istangram", "snapchat", "snap", 're:👻',   # 👻 = Snapchat-naam ("👻 voorbeeld.123")
  "no vinted", "pas via vinted", "pas par vinted", "nicht uber vinted", "nicht uber das vinted", "solo per vetrina",
  "spedisco privatamente", "spedizione privata", "echtzeit", "vorher zahlung", "zahlung vorab", "send the money",
  "send money", "refunder",
  # "eerst contact opnemen vóór je koopt" = gesprek buiten Vinted willen trekken
  "prima di acquistare", "prima dell'acquisto", "contattatemi prima", "bevor sie es kaufen", "vor dem kauf",
  "zuerst anschreiben", "vorher anschreiben", "avant d'acheter", "avant tout achat", "contact me before",
  "before buying", "antes de comprar", "voordat je koopt",
  # je koopt alleen een foto van een PS5
  "impresa en papel", "imagen impresa", "photo imprimee", "foto stampata", "solo la foto", "nur das bild",
  "picture only", "only the picture", "alleen de foto",
  # contactgegevens in de bio
  "leggi bio", "leggi la bio", "guarda in bio", "guarda la bio", "voir bio", "voir ma bio", "check bio", "check my bio",
  "mira mi bio", "siehe bio", "zie bio",
  # 20/10: varianten uit de opgeslagen advertenties
  "systemverkauf", "kein vinted kauf", "vor der zahlung", "bevor sie auf", "avant achat", "contacter avant",
  "antes de hacer la compra", "non spediamo tramite vinted", "non spedisco tramite vinted", "no hago envios por vinted",
  "kein versand uber vinted", "pas d'envoi via vinted", "pas d'envoi par vinted",
  "wallet vinted", "vinted wallet", "portefeuille vinted", "porte monnaie vinted", "portafoglio vinted", "monedero vinted",
  "paiement en prive", "paiement en mp", "pagamento in privato", "pago por privado", "zahlung privat", "passer prive",
  "passer en prive", "payment directly", "pay directly", "non leggo i messaggi", "non leggiamo i messaggi", "leggo solo su",
  "je ne lis pas les messages", "me estafaron", "malas experiencias", "trop eu de litige",
  're:https?://\S+',                     # links in beschrijving of bio
  're:(?i)\b(?:at|a|à|auf|op|por)\s*(?:1|un|one|uno|einen)\s*(?:€|euro)\b',  # "I'll put the play at one euro"
  # weigert betaling via Vinted: ontkenning + betalen + systeem/Vinted/app in dezelfde zin, behalve "alleen via Vinted"
  # ("Ich akzeptiere keine Zahlungen über das System", "PAS DE PAIEMENT VIA VINTED", "no acepto el pago por vinted")
  're:(?i)(?:\b(keine?[nr]?|nicht|ohne|geen|niet|nooit|no|non|pas|sans|sin|not|never|jamais|nunca|mai|don\x27?t|do not)\b(?:(?!uniquement|seulement|solo|solamente|only|nur|alleen|enkel|unicamente|exclusivement|esclusivamente)[^.!?\n]){0,40}\b(zahlung|bezahl|betaling|betaal|betalen|paiement|payer|pagament|pagar|pago|payment|pay)|\b(keine?[nr]?|nicht|ohne|geen|niet|nooit|no|non|pas|sans|sin|not|never|jamais|nunca|mai|don\x27?t|do not)\b[^.!?\n,]{0,15}\b(kauf|verkauf|achat|vente|vendit[ae]|venta|compra|acquist|buy|purchase|sale|koop|verkoop))\w*(?:(?!uniquement|seulement|solo|solamente|only|nur|alleen|enkel|unicamente|exclusivement|esclusivamente)[^.!?\n]){0,40}\b(system\w*|syst[eè]me|systeem|sistema|vinted|app|applicazione|application|aplicaci[oó]n|plattform|plateforme|piattaforma|plataforma|platform|site|sito|sitio|seite|website)\b(?!\W*(uniquement|seulement|solo|solamente|only|nur|alleen|enkel|unicamente|exclusivement|esclusivamente)\b)',
  're:[\w.+-]+@[\w-]+\.[a-z]{2,}',          # e-mailadres
  're:(?:\+|00)\d[\d .-]{7,}\d',            # internationaal telefoonnummer
  're:(?<![\d,.€])(?:\d[ .-]{0,2}){8,}\d(?![\d€])',  # telefoonnummer: 9+ cijfers, ook 351--23--45--678 (datums en 825 GB tellen niet)
]

